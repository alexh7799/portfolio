<div class="container hide-mobile" #mobileContainer>
  <div class="background">
    <app-policy-text id="start-mobile"></app-policy-text>
    <div class="arrow-text-container">
      <app-arrow class="hide-mobile" [href]="'start-mobile'"></app-arrow>
    </div>
    <app-social-media></app-social-media>
  </div>
  <app-footer-mobile></app-footer-mobile>
</div>

<div class="container hide-desktop" #desktopContainer>
  <div class="background">
    <app-policy-text id="start"></app-policy-text>
    <div class="arrow-text-container">
      <div class="hide-desktop">

      </div>
      <app-arrow class="hide-desktop" [href]="'start'"></app-arrow>
      <div class="hide-desktop">
        <a [routerLink]="['/legal-notice']" class="link" [class.active-link]="legalnotice.isActive"
            (mousedown)="legalnotice.isActive = true"
            (mouseup)="legalnotice.isActive = false">{{ 'footer.legal' | translate }}</a>
        <a [routerLink]="['/policy']" class="link" [class.active-link]="policy.isActive"
            (mousedown)="policy.isActive = true" (mouseup)="policy.isActive = false">{{
            'footer.policy' | translate }}</a>
        <p>&copy; Alexander Hörst 2025</p>
    </div>
    </div>
    <app-social-media></app-social-media>
  </div>
  <app-footer-desktop></app-footer-desktop>
</div>
